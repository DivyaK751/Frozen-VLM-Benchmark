[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "small-vlm"
version = "0.1.0"
description = "Small vision-language model: frozen SigLIP 2 encoder, trained projector, Qwen2.5-0.5B"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]